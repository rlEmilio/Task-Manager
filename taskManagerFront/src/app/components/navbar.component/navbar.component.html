<nav class="navbar navbar-expand-lg navbar-dark bg-black px-4">
  <a class="navbar-brand fw-bold" routerLink="/">Task Manager</a>

  <div class="ms-auto d-flex gap-2">
    @if (!isLoggedIn()) {
      <a class="btn btn-outline-light btn-sm" routerLink="/login" style="background: linear-gradient(135deg, #1f6feb, #7c3aed)">
        Login
      </a>

      <a class="btn btn-primary  btn-sm" routerLink="/register" style="background: linear-gradient(135deg, #1f6feb, #7c3aed)">
        Registro
      </a>
    }

    @if (isLoggedIn()) {
      <a class="btn btn-outline-light btn-sm" routerLink="/tasks">
        Mis tareas
      </a>

      @if (isAdmin()) {
        <a class="btn btn-warning btn-sm" routerLink="/admin">
          Panel admin
        </a>
      }

      <button class="btn btn-outline-danger btn-sm" (click)="logout()">
        Cerrar sesión
      </button>
    }
  </div>
</nav>
